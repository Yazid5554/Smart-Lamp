<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flora — Lamp Controller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e8e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 120px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    align-self: flex-start;
    width: 100%;
    max-width: 420px;
  }
  .flora-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c5aff, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    position: relative;
  }
  .flora-avatar .dot {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #3a3a52;
    border: 2px solid #0a0a0f;
    transition: background 0.3s;
  }
  .flora-avatar .dot.active { background: #60e090; }
  .flora-avatar .dot.thinking { background: #ffe060; animation: blink 0.6s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

  .header-info { flex: 1; }
  .header-name { font-size: 16px; font-weight: 600; color: #e8e8f0; }
  .header-status { font-size: 12px; color: #5a5a78; margin-top: 1px; transition: color 0.3s; }
  .header-status.on { color: #60e090; }

  .ip-row {
    display: flex; gap: 8px; align-items: center;
  }
  .ip-row input {
    background: #14141e;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    color: #9090b8;
    font-size: 12px;
    padding: 6px 10px;
    width: 140px;
    outline: none;
  }
  .ip-row input:focus { border-color: #5a5aff; color: #e8e8f0; }
  .ip-row button {
    background: none; border: 1px solid #2a2a3e; border-radius: 8px;
    color: #5a5a78; font-size: 12px; padding: 6px 12px; cursor: pointer;
  }
  .ip-row button:hover { color: #e8e8f0; }

  /* Chat area */
  .chat-area {
    width: 100%; max-width: 420px;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
    min-height: 300px;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .bubble.flora {
    background: #1a1428;
    border: 1px solid #2a1e4a;
    color: #d0c0f8;
    border-radius: 4px 16px 16px 16px;
    align-self: flex-start;
  }
  .bubble.user {
    background: #1e2a1e;
    border: 1px solid #1e3a1e;
    color: #a0d8a0;
    border-radius: 16px 16px 4px 16px;
    align-self: flex-end;
  }
  .bubble.action {
    background: none; border: none;
    color: #3a3a52; font-size: 12px; text-align: center;
    align-self: center; padding: 4px 0;
  }

  /* Bulb */
  .bulb-section {
    display: flex; flex-direction: column; align-items: center;
    margin: 8px 0;
    align-self: center;
  }
  .bulb-wrapper {
    position: relative; width: 90px; height: 90px;
    cursor: pointer; user-select: none;
  }
  .bulb-svg { width: 100%; height: 100%; transition: filter 0.4s; }
  .bulb-wrapper.on .bulb-svg {
    filter: drop-shadow(0 0 18px rgba(255,220,80,0.9)) drop-shadow(0 0 36px rgba(255,200,40,0.5));
  }
  .bulb-glow {
    position: absolute; inset: -24px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,60,0.12) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  .bulb-wrapper.on .bulb-glow { opacity: 1; }

  /* Bottom controls */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0d0d15;
    border-top: 1px solid #1a1a2a;
    padding: 16px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  .btn-row {
    display: flex; gap: 10px;
  }
  .btn {
    padding: 10px 28px; border-radius: 100px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.15s; outline: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn-toggle { background: #1e1e2e; color: #9090b8; border: 1px solid #2a2a3e; min-width: 140px; }
  .btn-toggle:hover { background: #252535; }
  .btn-toggle.on { background: #ffe060; color: #1a1400; border-color: #ffe060; }

  .voice-row {
    display: flex; align-items: center; gap: 10px;
  }
  .voice-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 100px;
    background: #14141e; border: 1px solid #2a2a3e;
    color: #9090b8; font-size: 13px; cursor: pointer;
    transition: all 0.2s; outline: none;
  }
  .voice-btn:hover { background: #1e1e2e; color: #e8e8f0; }
  .voice-btn.always-on {
    border-color: #6040ff; color: #a080ff; background: #12102a;
  }
  .voice-btn.listening {
    border-color: #ff4060; color: #ff4060; background: #1a0a0e;
    animation: pulse-border 1s ease-in-out infinite;
  }
  .voice-btn.waiting {
    border-color: #ffe060; color: #ffe060; background: #1a1400;
  }
  @keyframes pulse-border {
    0%, 100% { border-color: #ff4060; }
    50% { border-color: #ff8090; }
  }

  .voice-hint { font-size: 11px; color: #3a3a52; text-align: center; }

  /* Toast */
  .toast {
    position: fixed; bottom: 110px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e1e2e; border: 1px solid #2a2a3e;
    border-radius: 10px; padding: 8px 16px;
    font-size: 12px; color: #9090b8; opacity: 0;
    transition: all 0.3s; white-space: nowrap; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { color: #60e090; border-color: #1a3a28; }
  .toast.error { color: #ff6080; border-color: #3a1a22; }
</style>
</head>
<body>

<div class="header">
  <div class="flora-avatar">
    🌿
    <div class="dot" id="flora-dot"></div>
  </div>
  <div class="header-info">
    <div class="header-name">Flora</div>
    <div class="header-status" id="header-status">Standby</div>
  </div>
  <div class="ip-row">
    <input type="text" id="esp-ip" value="192.168.1.100" placeholder="IP ESP32"/>
    <button onclick="saveIP()">OK</button>
  </div>
</div>

<div class="chat-area" id="chat-area">
  <div class="bubble flora">Halo bos! Saya Flora. Bilang <strong>"hi flora"</strong> atau langsung <strong>"on"</strong> / <strong>"off"</strong> untuk kontrol lampu 💡</div>

  <div class="bulb-section">
    <div class="bulb-wrapper" id="bulb" onclick="toggleLamp()">
      <div class="bulb-glow"></div>
      <svg class="bulb-svg" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="74" width="24" height="5" rx="2" fill="#2a2a3e"/>
        <rect x="30" y="79" width="20" height="4" rx="1.5" fill="#242434"/>
        <rect x="31" y="83" width="18" height="4" rx="1.5" fill="#1e1e2e"/>
        <path d="M20 40 Q20 18 40 16 Q60 18 60 40 Q60 56 54 66 Q50 72 40 74 Q30 72 26 66 Q20 56 20 40Z"
              fill="#1c1c2c" id="bulb-glass"/>
        <path d="M33 55 L33 44 Q35 40 37 44 Q38 47 40 44 Q42 40 43 44 L43 55"
              stroke="#3a3a52" stroke-width="1.5" fill="none" stroke-linecap="round" id="filament"/>
        <path d="M27 32 Q29 24 35 22" stroke="#2a2a3e" stroke-width="1.5" fill="none" stroke-linecap="round" id="shine"/>
      </svg>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="btn-row">
    <button class="btn btn-toggle" id="toggle-btn" onclick="toggleLamp()">Nyalakan</button>
  </div>
  <div class="voice-row">
    <button class="voice-btn" id="voice-btn" onclick="toggleAlwaysOn()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="9" y1="22" x2="15" y2="22"/>
      </svg>
      <span id="voice-label">Aktifkan Flora</span>
    </button>
  </div>
  <div class="voice-hint" id="voice-hint">Tekan untuk mulai mendengarkan</div>
</div>

<div class="toast" id="toast"></div>

<script>
  let lampOn = false;
  let alwaysListening = false;
  let waitingForCommand = false; // setelah "hi flora" terpanggil
  let recognition = null;
  let synth = window.speechSynthesis;

  const espIpInput = document.getElementById('esp-ip');
  const bulbEl = document.getElementById('bulb');
  const chatArea = document.getElementById('chat-area');
  const voiceBtn = document.getElementById('voice-btn');
  const voiceLabel = document.getElementById('voice-label');
  const voiceHint = document.getElementById('voice-hint');
  const floraDot = document.getElementById('flora-dot');
  const headerStatus = document.getElementById('header-status');
  const toast = document.getElementById('toast');

  // ── IP ──
  function getIP() { return espIpInput.value.trim() || '192.168.1.100'; }
  function saveIP() {
    localStorage.setItem('esp_ip', getIP());
    showToast('IP disimpan: ' + getIP(), 'success');
  }
  const savedIP = localStorage.getItem('esp_ip');
  if (savedIP) espIpInput.value = savedIP;

  // ── Chat bubbles ──
  function addBubble(text, type) {
    const d = document.createElement('div');
    d.className = 'bubble ' + type;
    d.innerHTML = text;
    chatArea.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── TTS JARVIS-style ──
  let chosenVoice = null;

  function initVoice() {
    const voices = synth.getVoices();
    const priority = [
      v => v.name === 'Google UK English Male',
      v => v.name === 'Google UK English Male' ,
      v => v.name.includes('David') && v.lang.startsWith('en'),
      v => v.lang === 'en-GB' && !v.name.toLowerCase().includes('female') && !v.name.toLowerCase().includes('zira'),
      v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('female') && !v.name.toLowerCase().includes('zira'),
      v => v.lang.startsWith('en'),
    ];
    for (const test of priority) {
      const found = voices.find(test);
      if (found) { chosenVoice = found; break; }
    }
  }
  synth.onvoiceschanged = initVoice;
  initVoice();

  function floraSpeak(text) {
    if (!synth) return;
    synth.cancel();
    if (!chosenVoice) initVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = chosenVoice || null;
    u.lang = chosenVoice ? chosenVoice.lang : 'en-GB';
    u.rate = 0.9;   // lebih lambat, berwibawa
    u.pitch = 0.75; // dalam & rendah kayak JARVIS
    u.volume = 1;
    synth.speak(u);
  }

  // ── Bulb UI ──
  function updateUI(on) {
    lampOn = on;
    const toggleBtn = document.getElementById('toggle-btn');
    if (on) {
      bulbEl.classList.add('on');
      document.getElementById('bulb-glass').setAttribute('fill', '#fff9d6');
      document.getElementById('filament').setAttribute('stroke', '#ffcc30');
      document.getElementById('shine').setAttribute('stroke', '#ffe880');
      headerStatus.textContent = 'Lampu NYALA';
      headerStatus.className = 'header-status on';
      toggleBtn.textContent = 'Matikan';
      toggleBtn.classList.add('on');
    } else {
      bulbEl.classList.remove('on');
      document.getElementById('bulb-glass').setAttribute('fill', '#1c1c2c');
      document.getElementById('filament').setAttribute('stroke', '#3a3a52');
      document.getElementById('shine').setAttribute('stroke', '#2a2a3e');
      headerStatus.textContent = alwaysListening ? 'Mendengarkan...' : 'Standby';
      headerStatus.className = 'header-status';
      toggleBtn.textContent = 'Nyalakan';
      toggleBtn.classList.remove('on');
    }
  }

  async function setLamp(on) {
    const url = `http://${getIP()}${on ? '/on' : '/off'}`;
    try {
      await fetch(url, { method: 'GET', mode: 'no-cors' });
      updateUI(on);
      const msg = on ? 'Baik bos, lampu dinyalakan! 💡' : 'Siap bos, lampu dimatikan! 🌙';
      addBubble(msg, 'flora');
      floraSpeak(on ? 'Certainly boss, light activated' : 'Understood boss, light deactivated');
    } catch(e) {
      addBubble('Aduh, gagal konek ke ESP32. Cek IP ya bos 😓', 'flora');
      floraSpeak('I am unable to reach the device, boss. Please verify the IP address');
    }
  }

  function toggleLamp() { setLamp(!lampOn); }

  // ── Voice ──
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'id-ID';
    r.continuous = false;
    r.interimResults = false;

    r.onstart = () => {
      floraDot.className = 'dot active';
      voiceBtn.classList.add('listening');
      voiceBtn.classList.remove('always-on', 'waiting');
    };

    r.onresult = (e) => {
      const t = e.results[0][0].transcript.toLowerCase().trim();
      addBubble(t, 'user');
      handleSpeech(t);
    };

    r.onend = () => {
      if (alwaysListening) {
        // restart loop
        setTimeout(() => {
          try { r.start(); } catch(err) {}
        }, 300);
        if (waitingForCommand) {
          voiceBtn.classList.add('waiting');
          voiceBtn.classList.remove('listening');
          floraDot.className = 'dot thinking';
        } else {
          voiceBtn.classList.add('always-on');
          voiceBtn.classList.remove('listening', 'waiting');
          floraDot.className = 'dot active';
        }
      } else {
        voiceBtn.classList.remove('listening', 'always-on', 'waiting');
        floraDot.className = 'dot';
        voiceLabel.textContent = 'Aktifkan Flora';
        voiceHint.textContent = 'Tekan untuk mulai mendengarkan';
        headerStatus.textContent = 'Standby';
        headerStatus.className = 'header-status';
      }
    };

    r.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      showToast('Error: ' + e.error, 'error');
    };

    return r;
  }

  function handleSpeech(t) {
    // Mode: waiting for command setelah "hi flora"
    if (waitingForCommand) {
      waitingForCommand = false;
      voiceBtn.classList.remove('waiting');
      if (t.includes('nyala') || t.includes('on') || t.includes('hidup')) {
        setLamp(true);
      } else if (t.includes('mati') || t.includes('off') || t.includes('padam')) {
        setLamp(false);
      } else {
        addBubble('Mau apa bos? Bilang "on" atau "off" 😊', 'flora');
        floraSpeak('Pardon, boss? Please say on or off');
      }
      return;
    }

    // Panggil Flora
    if (t.includes('flora') || t.includes('hei flora') || t.includes('hi flora') || t.includes('hey flora')) {
      waitingForCommand = true;
      addBubble('Yes bos? 👋', 'flora');
      floraSpeak('Yes boss, at your service');
      voiceHint.textContent = 'Flora siap, sekarang bilang "on" atau "off"';
      return;
    }

    // Langsung perintah tanpa panggil Flora
    if (t.includes('nyala') || t.includes('on') || t.includes('hidup') || t.includes('hidupkan')) {
      setLamp(true);
    } else if (t.includes('mati') || t.includes('off') || t.includes('padam') || t.includes('matikan')) {
      setLamp(false);
    } else {
      // Abaikan noise, tidak perlu respon
    }
  }

  function toggleAlwaysOn() {
    if (!recognition) recognition = setupRecognition();
    if (!recognition) {
      showToast('Browser tidak support Speech Recognition', 'error');
      return;
    }

    if (alwaysListening) {
      alwaysListening = false;
      waitingForCommand = false;
      recognition.stop();
      voiceLabel.textContent = 'Aktifkan Flora';
      voiceHint.textContent = 'Tekan untuk mulai mendengarkan';
      addBubble('Flora standby. Sampai jumpa bos! 👋', 'flora');
      headerStatus.textContent = 'Standby';
      headerStatus.className = 'header-status';
    } else {
      alwaysListening = true;
      voiceLabel.textContent = 'Flora Aktif';
      voiceHint.textContent = '"hi flora" → tunggu respon → kasih perintah';
      headerStatus.textContent = 'Mendengarkan...';
      addBubble('Flora siap! Panggil saya atau langsung bilang on/off bos 🌿', 'flora');
      floraSpeak('Flora online. Awaiting your command, boss');
      try { recognition.start(); } catch(e) {}
    }
  }

  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
